services:
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: secureshop
      MYSQL_USER: secureshop
      MYSQL_PASSWORD: local-demo-password
      MYSQL_ROOT_PASSWORD: local-demo-root-password
    volumes:
      - shop-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 3s
      timeout: 2s
      retries: 30
volumes:
  shop-db:
